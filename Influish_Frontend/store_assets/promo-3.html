<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      width: 1080px;
      height: 1920px;
      background: #09090f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .glow-circle {
      position: absolute;
      width: 600px;
      height: 600px;
      top: -100px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.28) 0%, rgba(9, 9, 15, 0) 70%);
      pointer-events: none;
    }
    .header {
      text-align: center;
      padding: 60px 40px 30px;
      z-index: 10;
    }
    .badge {
      display: inline-block;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #c084fc;
      padding: 8px 24px;
      border-radius: 999px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 22px;
      color: #94a3b8;
      font-weight: 500;
      max-width: 800px;
    }
    .mockup-container {
      margin-top: 15px;
      width: 780px;
      height: 1480px;
      background: #151523;
      border-radius: 46px;
      border: 4px solid #2d2d44;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 50px rgba(168, 85, 247, 0.2);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }
    .mockup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
  </style>
</head>
<body>
  <div class="glow-circle"></div>
  <div class="header">
    <div class="badge">CREATOR MEDIA KIT</div>
    <h1 class="title">Showcase Live Analytics & Portfolio</h1>
    <p class="subtitle">Share verified engagement rates, followers & past collabs</p>
  </div>
  <div class="mockup-container">
    <img class="mockup-img" src="file:///C:/viz/app/fluencer/Fluencer_App/Influish_Frontend/store_assets/screenshot-3-creator-portfolio.jpg" />
  </div>
</body>
</html>
